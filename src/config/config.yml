# Global bot configuration.
# Values here act as defaults; per-guild overrides can be stored in MongoDB
# (GuildSettings) and take priority when present. The /welcome panel writes
# those same per-guild `welcome` overrides — it never introduces a second
# welcome configuration.

# Primary Server Admin Role ID (Members with this role or above can edit bot settings)
adminRoleId: "1547085020957773884"

welcome:
  enabled: true
  channelId: "1476620469288308861"          # Channel ID for welcome messages ("" = system channel fallback)
  welcomeBots: false     # Send welcome messages for bots too

  # ── Render mode ────────────────────────────────────────────────────────────
  # "classic" = title + copy blocks + banner image (everything configured below).
  # "card"    = ONE generated image: member avatar on the left, "Welcome to
  #             {server}" / "You are our #N member" on the right, plus a tiny
  #             mention line. See the `card:` section further down.
  # A single server can switch modes at runtime: /welcome → 🧩 Layout (saved per
  # server in GuildSettings.welcome.layout, so one bot can serve both styles).
  layout: "classic"

  # ── Welcome message layout ─────────────────────────────────────────────────
  # Rendered top → bottom in this order:
  #   title (with thumbnail) → description → greeting → steps → outro → image → footer
  # Placeholders: {user} {mention} {username} {displayname} {displaynameStyled}
  #               {server} {membercount} {joined} {created}
  title: "AVE Community"         # "" = no title line

  # 📝 Main copy (/welcome "Edit Message"). Blank lines start a new paragraph.
  description: |-
    Hey {mention} 👋

    Welcome to AVE!

    We're glad to have you here. Take a moment to explore the server, check the rules, and get familiar with the community.

  # Optional "get started" block — gets the same divider as every other block.
  steps: |-
    🌐 **GET STARTED**

    📜 Read the rules
    🎭 Choose your roles
    💬 Meet the community
    🚀 Explore the channels

  # Optional closing line.
  outro: "⚡ **Enjoy your stay!**"

  greeting: ""                   # styled username line; "" = hidden
  usernameInCard: false          # 🎨 true = bake the member's name into ./assets/welcome.gif (no banner image)
  separatorEnabled: true         # ➖ divider lines between the blocks above

  accentColor: "#57F287"         # green accent bar on the left of the container

  # 🖼️ Header thumbnail: the small square picture next to the title.
  # url = remote link · path = local file uploaded with the message (Discord CDN
  # links expire, a local file never does). Falls back to the member's avatar.
  thumbnail:
    enabled: true
    url: "https://media.discordapp.net/attachments/1547203322077913159/1547203546540281968/AVE_animated.gif?ex=6af64857&is=6af4f6d7&hm=066e11d30e2a9ae9b8d7d769dec80508e68df690d6f4a002d225816f3354b6bb&="
    path: ""                     # e.g. "./assets/welcome-thumbnail.gif" (wins over url)

  # 🖼️ Banner image at the bottom of the welcome message (the wide gif).
  # When a valid url or path is set it wins over the legacy welcome card / gif below.
  image:
    enabled: true
    url: "https://cdn.discordapp.com/attachments/1547203322077913159/1547203546091364492/z0IPi.gif?ex=6af64857&is=6af4f6d7&hm=10584a7e8a5a4643b3f0b89d21b99e9864762ba71b4a46a1d2ab3b547cf1b4a6&="
    path: ""                     # e.g. "./assets/welcome-banner.gif" (wins over url)

  # Legacy animated welcome GIF — only used when no banner image url is set.
  # source: "url"  -> uses the http(s) url below
  # source: "local" -> uploads the file at path (relative to project root)
  gif:
    enabled: false
    source: "local"            # "url" or "local"
    url: ""                    # e.g. "https://example.com/welcome.gif"
    path: "./assets/welcome.gif"  # used when source is "local"

  footer:
    enabled: false
    text: "You are member #{membercount} — enjoy your stay!"

  # ── "Card" layout artwork (only used when layout: "card") ─────────────────
  # The image is drawn in memory: background + circular avatar (left) + text
  # (right). Point `path` at a PNG/JPG/GIF in the project (wins over `url`); an
  # animated GIF background stays animated. Nothing is written to disk.
  card:
    background:
      path: ""             # e.g. "./assets/welcome-bg.png"
      url: ""              # used only when no local path is set
    heading: "WELCOME TO"                       # small line
    title: "{server}"                           # big line
    subtitle: "You are our #{membercount} member"
    mention: "{mention}"   # tiny line sent above the card — this is the ping; "" = no ping
    icon: true             # show the server icon next to the mention line
    scrim: true            # translucent panel behind the text so it stays readable on light artwork
    scrimOpacity: 0.6      # 0 = invisible, 1 = solid black

moderation:
  logs:
    enabled: true
    channelId: ""        # Channel ID for moderation logs ("" = logging disabled)

# Per-category server logging defaults (src/modules/logs).
# Per-guild overrides live in MongoDB GuildSettings.logs and take priority.
# "" channelId = not set (events for that category are skipped until configured).
logs:
  enabled: true          # Master switch for the whole logging system
  member: { enabled: true, channelId: "1492152450063532153" }
  message: { enabled: true, channelId: "1492152450063532153" }
  voice: { enabled: true, channelId: "1492152511036129300" }
  channel: { enabled: true, channelId: "1492152511036129300" }
  role: { enabled: true, channelId: "1492152511036129300" }
  moderation: { enabled: true, channelId: "1492152450063532153" }   # "" = fall back to moderation.logs.channelId
  server: { enabled: true, channelId: "1492152450063532153" }
  invite: { enabled: true, channelId: "1492152450063532153" }

antilink:
  enabled: true          # Server-wide default; per-guild overrides via /antilink

  deleteMessage: true   # Delete messages containing links
  warnUser: true         # Send a temporary warning when a link is blocked
  logAction: true        # Log blocked links via the moderation logging system

  warningDeleteDelay: 5000   # ms before the warning message auto-deletes
  warningCooldown: 10000     # ms of silence per user before sending another warning (rate limit)

  exempt:
    administrators: true    # Members with Administrator permission bypass Anti-Link
    moderators: false        # Members with Moderate Members / Manage Messages bypass Anti-Link
    bots: true               # Bot messages are never blocked
    webhooks: true           # Webhook messages are never blocked

automod:
  enabled: true            # Master switch; per-guild override via /automod enable|disable

  rules:
    antiLink:
      enabled: true        # Reuses the existing Anti-Link detection, config, and logging

    antiInvite:
      enabled: true        # Blocks discord.gg / discord.com/invite links

    antiSpam:
      enabled: true
      maxMessages: 5       # messages ...
      intervalSeconds: 5   # ... within this window
      warnCooldownSeconds: 10  # one warning per user per rule per window

    antiDuplicate:
      enabled: true
      maxDuplicates: 3     # repeats ...
      intervalSeconds: 10  # ... within this window (messages under 4 chars ignored)

    antiMentionSpam:
      enabled: true
      maxMentions: 5       # users + roles + @everyone/@here per message

    antiCaps:
      enabled: true
      minimumLength: 10    # letters required before checking
      percentage: 70       # uppercase percentage that triggers

    wordFilter:
      enabled: true
      words: []            # file-level blocked words (whole-word, case-insensitive)

    antiEveryone:
      enabled: true        # Blocks @everyone/@here mentions

    antiRaid:
      enabled: true
      joins: 5             # joins ...
      intervalSeconds: 10  # ... within this window
      lockdown: false      # when true, recent joiners are timed out (opt-in)
      raidTimeoutMinutes: 10
      alertCooldownSeconds: 300  # one raid alert per window (alerts, never mass-bans)

    massSpam:
      enabled: true
      maxMessages: 10      # higher threshold than antiSpam ...
      intervalSeconds: 10  # ... triggers a timeout instead of just a warning

  actions:
    deleteMessage: true
    warnUser: true
    warnDeleteDelay: 5000   # ms before the AutoMod warning message auto-deletes
    timeout:
      enabled: false       # master switch for timeouts (massSpam, raid lockdown)
      duration: 300        # default timeout seconds

  exemptions:
    punishAdmins: false    # never punish the owner; punish admins only if true
    roleIds: []            # exempt role IDs (per-guild additions via /automod whitelist)
    channelIds: []         # exempt channel IDs
    userIds: []            # exempt user IDs

embedBuilder:
  enabled: true             # Master switch for the /embed Components V2 builder

  sessionTimeoutMs: 900000  # Builder sessions expire after 15 minutes

  permissions:
    administrator: true    # Require Administrator permission to use /embed (unless owner/allowed role below)

  allowedRoleIds:
    - "1547085020957773884"
                          # Role IDs as strings, e.g. - "123456789012345678".
                          # Only owner/admins can change these via /embedconfig.

tickets:
  enabled: true             # Master switch for the ticket system

  panel:
    channelId: "1478780183291887636"           # Default channel for /ticket panel ("" = current channel)
    title: "🎫 AVE Support Center"
    description: "Need help? Select a category below.\nOur support team will assist you shortly."

  logs:
    enabled: true
    channelId: "1478779792072376511"   # Ticket log channel ("" = logging disabled)

  maxOpenTicketsPerUser: 1  # Duplicate-ticket protection (0 = unlimited)
  allowReclaim: false       # Allow a different staff member to take an already-claimed ticket
  creatorCanClose: true     # Ticket creator may close their own ticket (staff always can)
  creationCooldownMs: 30000 # Per-user cooldown between ticket creations (spam protection)

  # MENTION POLICY: the welcome message mentions ONLY the ticket creator
  # plus this global support role. "" = no global role ping (per-category
  # staffRoleIds below are still mentioned). Never hardcode roles in code.
  support_role_id: "1547085020957773884"       # Global support role ID, e.g. "1556360796085293146"

  naming:
    format: "ticket-{number}"   # Tokens: {number} {username} {category} — sequential IDs never reuse numbers

  close:
    deleteImmediately: false  # false = archive (lock + optional move), true = delete channel on close
    deleteDelayMs: 10000       # Wait before deleting when deleteImmediately is true
    closedCategoryId: ""                      # Move closed tickets here ("" = stay in place)
    lockOnClose: true          # Revoke Send Messages from the creator on close

  categories:
    # Categories are data-driven: add more keys (appeals, partnership, ...)
    # without changing code. Each supports: name, description, emoji,
    # categoryId (Discord category), staffRoleIds, accent (hex, optional).

    general:
      name: "General Support"
      description: "Get help with general questions"
      emoji: "🎫"
      categoryId: ""
      staffRoleIds:
        - "1547085020957773884"

    report:
      name: "Technical Support / Report"
      description: "Report an issue, user, or bug"
      emoji: "🛠️"
      categoryId: ""
      staffRoleIds:
        - "1547085020957773884"

    purchase:
      name: "Purchase / Donation Support"
      description: "Get help with purchases or donations"
      emoji: "💰"
      categoryId: ""
      staffRoleIds:
        - "1547085020957773884"

autorole:
  enabled: false         # Disabled by default; enable per server via /autorole enable

  roles: []              # Role IDs assigned automatically to new members

  bots: false            # Whether bots also receive autoroles

  delay: 0               # ms to wait before assigning (0 = immediately, non-blocking)

  logs:
    enabled: true        # Log assignments/failures to the moderation log channel

management:
  allowedRoleIds:
    - "1547085020957773884"

polls:
  enabled: true          # Master switch for /poll
  channelId: ""          # Default channel for polls ("" = current channel)

suggestions:
  enabled: true          # Master switch for /suggest
  channelId: ""          # Suggestion channel ("" = current channel)

reminders:
  enabled: true          # Master switch for /remind and /reminders

afk:
  enabled: true          # Master switch for /afk

youtube_promotion:
  enabled: true
  allowed_role_id: ""     # Role ID allowed to use /videos ("" = feature denies access until set)
  channel_id: ""          # Promotion channel ID ("" = must be configured before use)
  cooldown_seconds: 300   # Per-user cooldown between promotions (0 = disabled)
  duplicate_cooldown_seconds: 1800  # Same member cannot re-promote the same video within this window (0 = disabled)
  youtube_api_key: ""     # Fallback only — prefer the YOUTUBE_API_KEY env var. Empty = oEmbed/ID fallback.

invites:
  enabled: true             # Master switch for invite tracking system
  logChannelId: ""          # Dedicated channel for invite join/leave notifications ("" = use logs.invite channel or member channel)
  minAccountAgeDays: 3      # Accounts younger than this are flagged as fake invites (0 = disable)
  trackLeaves: true         # Whether to count leaves against the inviter
  joinMessage: "📥 **{member}** joined using invite code `{code}` from **{inviter}** (now has **{inviterTotal}** invites)!"
  leaveMessage: "📤 **{member}** left. They were invited by **{inviter}** (now has **{inviterTotal}** invites)."
  vanityJoinMessage: "📥 **{member}** joined using the server vanity URL!"
  unknownJoinMessage: "📥 **{member}** joined (invite could not be determined)."

music:
  enabled: true             # Master switch for Lavalink music system
  defaultSearchEngine: "youtube" # Default search provider: "youtube" or "soundcloud"
  defaultVolume: 80         # Default playback volume (1-100)
  leaveOnEmptyDelayMs: 60000 # Wait 1 minute after queue empties before leaving voice channel
  nodes:                    # Lavalink v3/v4 nodes (can also configure via .env: LAVALINK_HOST, etc.)
    - name: "Main-Node"
      url: "localhost:2333" # Node host:port
      auth: "youshallnotpass" # Lavalink node password
      secure: false         # true if SSL/WSS, false for plain HTTP/WS

